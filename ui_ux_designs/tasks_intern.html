<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App designs | Tharshan R</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0d0d0d;
      color: white;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    /* Header animation */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      z-index: 1000;
      animation: slideDown 1s ease;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .por {
      font-size: 2em;
      font-weight: bold;
      color: #a855f7;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
    }

   
    nav a {
      margin-left: 1.5rem;
      color: white;
      text-decoration: none;
      position: relative;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    nav a::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #a855f7, #60a5fa);
      transition: width 0.4s ease;
      border-radius: 2px;
    }

    nav a:hover {
      color: #a855f7;
      transform: translateY(-3px);
      text-shadow: 0 0 8px #a855f7;
    }

    nav a:hover::after {
      width: 100%;
    }

    main {
      max-width: 1000px;
      margin: 6rem auto 2rem;
      padding: 2rem;
    }

    .project-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }

    .project-card {
      width: 250px;
      height: 250px;
      background: #1f1f1f;
      padding: 1.5rem;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.8s ease forwards;
    }

    /* Animate cards one by one */
    .project-card:nth-child(1) {
      animation-delay: 0.3s;
    }

    .project-card:nth-child(2) {
      animation-delay: 0.6s;
    }

    .project-card:nth-child(3) {
      animation-delay: 0.9s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .project-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    }

    .project-card h3 {
      font-size: 1.25rem;
      font-weight: 600;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .project-card:hover h3 {
      color: #a855f7;
      text-shadow: 0 0 8px #a855f7;
    }

    .project-card p {
      color: #ccc;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .project-card span {
      font-size: 0.9rem;
      transition: color 0.3s, transform 0.3s;
    }

    .project-card:hover span {
      color: #60a5fa;
      transform: translateX(5px);
    }
  </style>
</head>

<body>
  <header>
    <h1 class="por">UI UX Designs</h1>
    <nav>
      <a href="/index.html">Home</a>
      <a href="/index.html#projects">All Projects</a>
      <a href="/index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <div class="project-grid">
      <a href="cognifyz_interns.html" target="_self" class="project-card">
        <div>
          <h3>Cognifyz Internship Tasks</h3>
          <p>Task 6 out of 8 I have completed</p>
        </div>
        <span>View one by one →</span>
      </a>
    </div>
  </main>
</body>

</html>
