<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MULTIPLE FORM FILLER Video</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.8rem;
      color: #a855f7;
      margin-bottom: 2rem;
      text-align: center;
      animation: fadeInDown 1s ease;
    }

    video {
      width: 100%;
      max-width: 850px;
      border: 4px solid transparent;
      border-radius: 1rem;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      background-image: linear-gradient(#0d0d0d, #0d0d0d),
                        linear-gradient(90deg, #a855f7, #60a5fa, #a855f7);
      background-origin: border-box;
      background-clip: content-box, border-box;
      animation: fadeInUp 1.2s ease, borderGlow 6s linear infinite;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    video:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
    }

    /* Animations */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes borderGlow {
      0% {
        background-image: linear-gradient(#0d0d0d, #0d0d0d),
                          linear-gradient(90deg, #a855f7, #60a5fa, #a855f7);
      }
      50% {
        background-image: linear-gradient(#0d0d0d, #0d0d0d),
                          linear-gradient(90deg, #60a5fa, #a855f7, #60a5fa);
      }
      100% {
        background-image: linear-gradient(#0d0d0d, #0d0d0d),
                          linear-gradient(90deg, #a855f7, #60a5fa, #a855f7);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      video {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>MULTIPLE FORM FILLER</h1>

  <video controls controlsList="nodownload">
