<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkShops_Certificate - Tharshan R</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d;
            color: white;
            min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.85);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            margin-left: 1.5rem;
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #a855f7;
        }

        h1 {
            text-align: center;
            margin: 2rem 0 1rem;
            font-size: 2.5rem;
            color: #a855f7;
        }

        .certificate-grid {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }

        .certificate-card {
            text-align: center;
            text-decoration: none;
            color: inherit;
        }

        .certificate-card img {
            border-radius: 1rem;
            width: 420px;
            height: 300px;
            padding: 0.3rem;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .certificate-card img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
        }

        .certificate-card p {
            font-size: 1rem;
            color: #ccc;
            margin-top: 0.5rem;
            transition: color 0.3s ease;
        }

        .certificate-card:hover p {
            color: #a855f7;
        }

        footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: #888;
            background: #0d0d0d;
            margin-top: 2rem;
        }

        @media (max-width: 500px) {
            .certificate-card img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>MyPortfolio</h2>
        <nav>
            <a href="../index.html">&larr; Back</a>
        </nav>
    </header>

    <h1>Web Development Certificates</h1>

    <div class="certificate-grid">
        <div class="certificate-card">
            <a href="#" target="_self">
                <img src="./web_Dev_images/Rinex_internship_cert.jpeg" alt="Instagram Clone Certificate">
            </a>
            <p>Rinex Web Development Internship Certificate</p>
        </div>
        
    </div>

    <footer>
        &copy; 2025 Tharshan R. All rights reserved.
    </footer>
</body>

</html>
