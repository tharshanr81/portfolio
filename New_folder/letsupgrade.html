<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificates - Tharshan R</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div a {
            cursor: default;
        }

        nav a {
            margin-left: 1.5rem;
            color: white;
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, #a855f7, #60a5fa);
            transition: width 0.4s ease;
            border-radius: 2px;
        }

        nav a:hover {
            color: #a855f7;
            transform: translateY(-3px);
            text-shadow: 0 0 8px #a855f7;
        }

        nav a:hover::after {
            width: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d;
            color: white;
        }

        header {
            background: rgba(0, 0, 0, 0.85);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            margin-left: 1.5rem;
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #a855f7;
        }

        h1 {
            text-align: center;
            margin: 2rem 0 1rem;
            font-size: 2.5rem;
            color: #a855f7;
        }

        .certificate-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }

        .certificate-card {
            text-align: center;
            text-decoration: none;
            color: inherit;
            border-radius: 1rem;
            overflow: hidden;
            animation: fadeIn 0.8s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .certificate-card:nth-child(1) {
            animation-delay: 0.2s;
        }

        .certificate-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .certificate-card:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .certificate-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 1rem;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .certificate-card img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
        }

        .certificate-card p {
            font-size: 1rem;
            color: #ccc;
            margin-top: 0.5rem;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2rem;
            }

            .certificate-card img {
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Certificates</h2>
        <nav>
            <a href="/certificate_beyond.html" target="_parent">&larr; Back</a>
        </nav>
    </header>

    <h1>LetsUpgrade Bootcamps Certificates</h1>

    <div class="certificate-grid">
        <div class="certificate-card">
            <a href="#" target="_self">
                <img src="letsupgrade/html&css.jpg" alt="HTML & CSS Certificate">
            </a>
            <p>Three days Bootcamp HTML & CSS</p>
        </div>

        <div class="certificate-card">
            <a href="#" target="_self">
                <img src="letsupgrade/instagramclone figma.jpg" alt="Instagram Clone Certificate">
            </a>
            <p>Three days Bootcamp Instagram Clone using Figma</p>
        </div>

        <div class="certificate-card">
            <a href="#" target="_self">
                <img src="letsupgrade/netflixclone.jpg" alt="Netflix Clone Certificate">
            </a>
            <p>Two days Bootcamp Netflix Clone using HTML & CSS</p>
        </div>
    </div>

</body>

</html>
